name = "hike-plot"
main = "worker/index.ts"
compatibility_date = "2025-01-01"

# keep the custom domain across deploys (a Cloudflare zone on this account)
routes = [{ pattern = "hike.bobsabayesian.io", custom_domain = true }]
# also keep the *.workers.dev address working (wrangler turns it off when this line is missing)
workers_dev = true
preview_urls = false

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/admin", "/admin/*"]

# saved projects live in the shared project-files bucket, under hike/
[[r2_buckets]]
binding = "PROJECTS"
bucket_name = "project-files"

# the admin page (/admin) lists every saved project, so it sits behind Cloudflare Access (Zero Trust) and the Worker checks the Access
# token as well. Fill ACCESS_AUD in from the Access application's Audience tag; while either is empty, /admin is shut.
[vars]
ACCESS_TEAM_DOMAIN = "little-firefly-6873.cloudflareaccess.com"
ACCESS_AUD = ""
