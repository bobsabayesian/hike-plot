<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin · Walk of Frame</title>
  <style>
    :root { --bg: #fafafa; --panel: #fff; --text: #1d1d1f; --dim: #6b6b72; --line: #dcdce0; --accent: #1f5fbf; }
    @media (prefers-color-scheme: dark) { :root { --bg: #17171a; --panel: #202024; --text: #ececf0; --dim: #9a9aa4; --line: #34343a; --accent: #6ea4f5; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, sans-serif; }
    header { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
    h1 { margin: 0; font-size: 16px; } h2 { margin: 0 0 10px; font-size: 14px; }
    main { padding: 20px; display: grid; gap: 24px; max-width: 1200px; margin: 0 auto; }
    .dim { color: var(--dim); } .mono { font-family: ui-monospace, monospace; }
    .tot { display: flex; gap: 24px; flex-wrap: wrap; } .tot b { font-size: 20px; display: block; }
    table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
    th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); } th { font-weight: 600; color: var(--dim); font-size: 12px; }
    tr:last-child td { border-bottom: 0; } td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
    a { color: var(--accent); } input { font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: var(--text); }
    .err { color: #c0392b; } [hidden] { display: none !important; }
    @media (max-width: 600px) { main { padding: 12px; } th, td { padding: 6px 8px; } }
  </style>
</head>
<body>
  <header>
    <h1>Walk of Frame: admin</h1>
    <span class="dim">Signed in as <span id="who" class="mono">…</span> · read-only</span>
  </header>
  <main>
    <section><div class="tot" id="totals"></div></section>
    <section>
      <h2>Saved projects</h2>
      <p><input id="find" type="search" placeholder="Find a code, name or place" aria-label="Find a project" /></p>
      <p id="msg" class="dim">Loading…</p>
      <table id="table" hidden>
        <thead><tr><th>Code</th><th>Name</th><th>Place</th><th>Saved</th><th class="n">Track points</th><th class="n">Size</th><th>Links</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </section>
  </main>
  <script type="module" src="/src/admin/main.ts"></script>
</body>
</html>
